name: Build wipeout-reworked (SDL3 - GL & VK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - renderer: GL
            artifact_name: wipegame-sdl3-opengl
          - renderer: VK
            artifact_name: wipegame-sdl3-vulkan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (OpenGL, GLEW & Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libglew-dev \
            libvulkan-dev \
            vulkan-tools

      - name: Setup SDL3 from source
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Build with Makefile (SDL3 target)
        run: |
          # Expose compiled SDL3 to pkg-config so the Makefile finds it
          export PKG_CONFIG_PATH="${{ steps.sdl.outputs.prefix }}/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          make clean
          # Pass the renderer parameter to the makefile along with the sdl3 target
          make sdl3 RENDERER=${{ matrix.renderer }} -j$(nproc)

      - name: Rename binary to avoid overwrite during upload
        run: |
          mv wipegame wipegame-${{ matrix.renderer }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: wipegame-${{ matrix.renderer }}
