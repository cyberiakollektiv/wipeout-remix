name: Build wipeout-reworked (Multiplatform - SDL3 + OpenXR)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            renderer: GL
            artifact_name: wipegame-linux-x64-opengl
            binary_name: wipegame
          - os: ubuntu-latest
            arch: x64
            renderer: VK
            artifact_name: wipegame-linux-x64-vulkan
            binary_name: wipegame

          - os: ubuntu-24.04-arm
            arch: arm64
            renderer: GL
            artifact_name: wipegame-linux-arm64-opengl
            binary_name: wipegame
          - os: ubuntu-24.04-arm
            arch: arm64
            renderer: VK
            artifact_name: wipegame-linux-arm64-vulkan
            binary_name: wipegame

          - os: windows-latest
            arch: x64
            renderer: GL
            artifact_name: wipegame-windows-opengl
            binary_name: wipegame.exe
          - os: windows-latest
            arch: x64
            renderer: VK
            artifact_name: wipegame-windows-vulkan
            binary_name: wipegame.exe

          - os: macos-latest
            arch: arm64
            renderer: GL
            artifact_name: wipegame-macos-arm64-opengl
            binary_name: wipegame
          - os: macos-latest
            arch: arm64
            renderer: MTL
            artifact_name: wipegame-macos-arm64-metal
            binary_name: wipegame

          - os: macos-13
            arch: x64
            renderer: GL
            artifact_name: wipegame-macos-x64-opengl
            binary_name: wipegame
          - os: macos-13
            arch: x64
            renderer: MTL
            artifact_name: wipegame-macos-x64-metal
            binary_name: wipegame

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies & OpenXR Loader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libglew-dev \
            libvulkan-dev \
            vulkan-tools \
            libopenxr-dev \
            libopenxr-loader1

      - name: Setup MSYS2 (Windows) & Install OpenXR Packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-vulkan-devel
            mingw-w64-x86_64-openxr

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install glew

      - name: Setup SDL3 from source
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Build with Makefile (Unix)
        if: runner.os != 'Windows'
        run: |
          export PKG_CONFIG_PATH="${{ steps.sdl.outputs.prefix }}/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          make clean
          make sdl3 RENDERER=${{ matrix.renderer }} OPENXR=1 -j$(sysctl -n hw.ncpu 2>/dev/null || nproc)

      - name: Build with Makefile (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          SDL_PREFIX=$(cygpath -u "${{ steps.sdl.outputs.prefix }}")
          export PKG_CONFIG_PATH="$SDL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          make clean
          make sdl3 RENDERER=${{ matrix.renderer }} OPENXR=1 -j$(nproc)

      - name: Rename binary
        shell: bash
        run: |
          TARGET_BIN="${{ matrix.binary_name }}"
          OUTPUT_BIN="wipegame-${{ matrix.renderer }}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ -f "$TARGET_BIN" ]; then
            mv "$TARGET_BIN" "$OUTPUT_BIN"
          elif [ -f "wipegame" ]; then
            mv "wipegame" "$OUTPUT_BIN"
          elif [ -f "wipegame.exe" ]; then
            mv "wipegame.exe" "$OUTPUT_BIN.exe"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: wipegame-${{ matrix.renderer }}-${{ matrix.os }}-${{ matrix.arch }}*
