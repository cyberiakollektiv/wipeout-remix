name: Build wipeout-rework (SDL3 + OpenGL)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (OpenGL & GLEW)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libglew-dev

      - name: Setup SDL3 from source
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Build with Makefile (SDL3 target)
        run: |
          # Expose compiled SDL3 to pkg-config so the Makefile finds it
          export PKG_CONFIG_PATH="${{ steps.sdl.outputs.prefix }}/lib/pkgconfig:$PKG_CONFIG_PATH"
          make clean
          make sdl3 -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wipegame-sdl3-opengl
          path: wipegame
